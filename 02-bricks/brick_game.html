<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무지개 하트 벽돌깨기</title>
  <link rel="stylesheet" href="brick_game.css">
</head>
<body>
  <main class="게임-화면">
    <h1 class="화면읽기-전용">무지개 하트 벽돌깨기</h1>
    <canvas
      id="게임판"
      width="960"
      height="700"
      tabindex="0"
      aria-label="무지개 하트 벽돌깨기 게임. 왼쪽과 오른쪽 방향키 또는 A와 D 키로 조작하고, 스페이스키로 시작합니다."
    >
      이 게임을 실행하려면 캔버스를 지원하는 최신 브라우저가 필요합니다.
    </canvas>
    <p class="화면읽기-전용">
      왼쪽과 오른쪽 방향키 또는 A와 D 키로 조작 바를 움직입니다.
      스페이스키를 누르면 게임이 시작됩니다.
    </p>
  </main>

  <script src="brick_game.js"></script>
</body>
</html>
